<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sheru Bhai Runner</title>
<style>
:root{--gold:#ffc83d;--pk:#ff4f86;--pn:rgba(40,18,76,.92);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1033;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;z-index:5}
.mid{justify-content:center;gap:14px;background:rgba(15,8,35,.62)}
.hide{display:none!important}
h1{margin:0;font-size:clamp(40px,14vw,72px);line-height:.95;font-weight:900;font-style:italic;color:#ffd51a;-webkit-text-stroke:3px #1a1200;paint-order:stroke fill;text-shadow:0 6px 0 #1a1200,0 12px 18px rgba(0,0,0,.45);transform:rotate(-4deg)}
h1 span{display:block;color:#fff;font-size:.6em;letter-spacing:4px;-webkit-text-stroke:2px #1a1200;text-shadow:0 4px 0 #1a1200}
h2{margin:0 0 4px;font-size:26px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.bot{display:flex;flex-direction:column;gap:14px;align-items:center}
.btn{border:0;border-radius:18px;padding:13px 20px;font:900 18px "Trebuchet MS",system-ui,sans-serif;color:#4a2200;background:linear-gradient(#ffe07a,#ff9d1c);box-shadow:0 5px 0 #b3590a,0 10px 18px rgba(0,0,0,.35);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b3590a}
.btn:disabled{filter:grayscale(.9) brightness(.7)}
.btn.play{font-size:32px;padding:16px 58px;color:#073b2c;background:linear-gradient(#7dffc9,#1fc98f);box-shadow:0 6px 0 #0c7a58,0 12px 20px rgba(0,0,0,.4)}
.btn.sm{padding:9px 14px;font-size:16px;white-space:nowrap}
.btn.gr{color:#fff;background:linear-gradient(#8a7cc4,#5a4a9c);box-shadow:0 5px 0 #34286b}
.pill{background:rgba(20,10,45,.7);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:6px 14px;font-weight:900;font-size:18px;display:flex;gap:6px;align-items:center}
.pill small{font-size:11px;opacity:.75;margin-left:6px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
.top>*{pointer-events:auto}
.ic{width:48px;height:48px;border:0;border-radius:50%;font-size:22px;background:rgba(20,10,45,.7);color:#fff;border:2px solid rgba(255,255,255,.25)}
#shb{position:absolute;left:14px;top:calc(64px + env(safe-area-inset-top,0px));font-size:26px}
#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:rgba(20,10,45,.8);padding:10px 18px;border-radius:16px;font-weight:900;font-size:17px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1}
.panel{background:var(--pn);border:3px solid rgba(255,255,255,.2);border-radius:26px;padding:18px;width:min(92vw,430px);display:flex;flex-direction:column;gap:10px;align-items:center}
#pbody{width:100%;max-height:62vh;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;align-items:center}
.card{width:100%;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.08);border-radius:18px;padding:10px;text-align:left;border:2px solid transparent}
.card.on{border-color:var(--gold)}
.card .ct{flex:1;display:flex;flex-direction:column;gap:2px}
.card small{opacity:.75;font-size:12px}
.pips{letter-spacing:3px;color:var(--gold);font-size:13px}
.ic2{font-size:32px;width:44px;text-align:center}
.sw{width:44px;height:56px;border-radius:14px;border:2px solid #fff3}
.mx{font-weight:900;color:var(--gold)}
.av{width:60px;height:60px;border-radius:50%;border:3px solid var(--gold);object-fit:cover}
.big{font-size:56px;font-weight:900;color:var(--gold);line-height:1}
.big{font-size:56px}
#ban{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:clamp(34px,13vw,64px);font-weight:900;font-style:italic;color:#ffd51a;-webkit-text-stroke:2px #1a1200;paint-order:stroke fill;text-shadow:0 6px 0 #1a1200;z-index:7;pointer-events:none;animation:bn 1.9s forwards}
@keyframes bn{0%{transform:scale(2.6);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.1);opacity:0}}
#wd{position:absolute;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));display:flex;gap:6px;justify-content:center}
#wd i{font-style:normal;font-weight:900;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(20,10,45,.6);color:#fff6;border:2px solid #fff3}
#wd i.on{background:var(--gold);color:#16110a;border-color:#fff}
input{-webkit-user-select:text;user-select:text;border-radius:10px;border:2px solid #fff4;background:#0006;color:#fff;padding:8px;font:700 16px "Trebuchet MS",system-ui,sans-serif;width:100%}
.lbx{width:100%;display:flex;flex-direction:column;gap:4px}.lr{display:flex;gap:10px;width:100%;padding:6px 10px;border-radius:10px;background:#fff1}.lr span:nth-child(2){flex:1;text-align:left}.lr.me{background:#ffc83d44}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><div class="top"><div class="pill">🪙 <b id="hc">0</b> 💎 <b id="hg">0</b></div><div class="pill"><b id="hd">0</b> m<small>BEST <span id="hb">0</span></small></div><button class="ic" id="pb">⏸</button></div><div id="wd"></div><div id="shb" class="hide">🛡️</div></div>
<div id="toast"></div><div id="ban" class="hide"></div>
<div class="scr" id="menu">
 <h1>Sheru<br>Bhai<span>RUNNER</span></h1>

 <div class="bot"><button class="btn play" id="play">▶ PLAY</button>

</div>
<div class="scr mid hide" id="pause"><div class="panel"><h2>Paused</h2><button class="btn play" id="resume" style="font-size:24px;padding:12px 40px">▶ Resume</button><div class="row"><button class="btn" id="prs">↻ Restart</button><button class="btn gr" id="phome">🏠 Home</button></div></div></div>

<div class="scr mid hide" id="panel" style="z-index:8"><div class="panel"><div id="pbody"></div><button class="btn gr" data-a="close">✕ Close</button></div></div>

 h.b.visible=run&&!!P.sh;h.jp.visible=run&&P.jet>0;if(h.jp.visible){h.jp.children[2].scale.y=h.jp.children[3].scale.y=.4+Math.random()*.6}h.bd.visible=run&&P.board>0;g.visible=!(run&&P.inv>0)||Math.floor(tm*20)%2==0}
function idle(dt){moveWorld(8,dt);travel+=8*dt;const a=Math.PI+Math.sin(tm*.5)*.9;cam.position.set(Math.sin(a)*5.2,2.3,Math.cos(a)*5.2);cam.lookAt(0,1.2,0)}
const skyC=new T.Color();let last=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;tm+=dt;
 if(st=='play')play(dt);else if(st=='menu')idle(dt);
 if(st=='play'||st=='pause'||st=='over')anim(st=='pause'?0:dt,true);else anim(dt,false);
 if(st=='menu'){hero.g.position.set(0,0,0)}
const nt2=thm(travel)>=5,ke=Math.min(1,dt*1.5);hemi.intensity+=((nt2?.6:.92)-hemi.intensity)*ke;sun.intensity+=((nt2?.4:.95)-sun.intensity)*ke;sunM.material.color.lerp(nt2?MOON:SUNC,ke);stars.material.opacity+=((nt2?1:0)-stars.material.opacity)*ke;
 notes(dt);if(rg>0){rg-=dt*1.4;const s=1+(1-rg)*9;ring.scale.set(s,s,s);ring.material.opacity=Math.max(0,rg)*.8;ring.position.x=P?P.x:0}else ring.material.opacity=0;
 skyC.set(TH[thm(travel)].sky);sc.background.lerp(skyC,Math.min(1,dt*1.2));sc.fog.color.copy(sc.background);
 R.render(sc,cam)}
/* ---------- input ---------- */
let sx=0,sy=0,dn=0;
addEventListener('pointerdown',e=>{au();sx=e.clientX;sy=e.clientY;dn=1;tt0=performance.now()});
addEventListener('pointermove',e=>{if(!dn||st!='play')return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>28){dir(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy<0?'u':'d'));dn=0}});
addEventListener('pointerup',e=>{dn=0;const n=performance.now();if(st=='play'&&Math.hypot(e.clientX-sx,e.clientY-sy)<14&&n-tt0<250){if(n-lt<350){lt=0;board()}else lt=n}});addEventListener('pointercancel',()=>dn=0);
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();({arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',' ':'u',arrowdown:'d',s:'d'})[k]&&dir(({arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',' ':'u',arrowdown:'d',s:'d'})[k]);if(k=='p'||k=='escape')pz();if(k=='b')board()});
function pz(){if(st=='play'&&!dead){setSt('pause');save()}else if(st=='pause')setSt('play')}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play'&&!dead)pz()});
$('pb').onclick=pz;$('resume').onclick=pz;$('prs').onclick=start;$('phome').onclick=home;$('ors').onclick=start;$('ohome').onclick=home;$('play').onclick=start;$('rev').onclick=revive;$('olb').onclick=()=>{au();panel('lb')};$('panel').addEventListener('change',e=>{if(e.target.id=='nm'){S.name=(e.target.value.trim()||'Player').slice(0,12);save();S.posted=0;if(S.best)postScore()}});
/* ---------- panels ---------- */
let rc=0;
function panel(k){let h='';const pl=`<div class="pill">🪙 ${S.coins}</div>`;
 if(k=='shop')h=`<h2>🛒 Shop</h2>${pl}`+Object.entries(UP).map(([id,u])=>{const l=S.up[id],mx=u.c.length,c=u.c[l];return`<div class="card"><div class="ic2">${u.i}</div><div class="ct"><b>${u.n}</b><small>${u.d}</small><div class="pips">${'●'.repeat(l)+'○'.repeat(mx-l)}</div></div>${l>=mx?'<span class="mx">MAX</span>':`<button class="btn sm" data-a="up" data-k="${id}" ${S.coins<c?'disabled':''}>🪙 ${c}</button>`}</div>`}).join('');
 if(k=='chars')h=`<h2>🧒 Heroes</h2>${pl}`+CH.map((c,i)=>{const o=S.owned.includes(i);return`<div class="card${S.sel==i?' on':''}">${c.lion?`<img class="sw" src="${PHOTO}" style="object-fit:cover">`:`<div class="sw" style="background:linear-gradient(${hx(c.top)} 55%,${hx(c.bot)} 55%)"></div>`}<div class="ct"><b>${c.n}</b><small>${c.d}</small></div>${o?(S.sel==i?'<span class="mx">✓ ON</span>':`<button class="btn sm" data-a="sel" data-k="${i}">Select</button>`):`<button class="btn sm" data-a="buy" data-k="${i}" ${S.coins<c.p?'disabled':''}>🪙 ${c.p}</button>`}</div>`}).join('');
 if(k=='set')h=`<h2>⚙️ Settings</h2><div class="card"><div class="ct"><b>Player name</b><input id="nm" maxlength="12" value="${esc(S.name)}"></div></div>`+[['music','🎵 Music',S.music],['sfx','🔊 Sound effects',S.sfx],['q','✨ High graphics',S.q]].map(([id,n,v])=>`<div class="card"><div class="ct"><b>${n}</b></div><button class="btn sm ${v?'':'gr'}" data-a="tg" data-k="${id}">${v?'ON':'OFF'}</button></div>`).join('')+`<div class="card"><div class="ct"><b>Reset progress</b><small>Erase coins, heroes and best score</small></div><button class="btn sm gr" data-a="rst">${rc?'Tap to confirm':'Reset'}</button></div><small>Controls: swipe ← → ↑ ↓ (or arrow keys)</small>`;
 if(k=='lb')h=`<h2>🏆 Leaderboard</h2><div class="pill">Your best: ${S.best} m</div><b>🌍 Global</b><div id="gl" class="lbx">${DB&&UID?'Loading…':'Open in claude.ai (signed in) for the global board'}</div><b>📱 This device</b><div class="lbx">${S.top.length?S.top.map((t,i)=>`<div class="lr"><span>${i+1}.</span><span>${esc(t.n)}</span><b>${t.m} m</b></div>`).join(''):'Run to set a score!'}</div>`;
 $('pbody').innerHTML=h;$('panel').dataset.k=k;show('panel',1);if(k=='lb'&&DB&&UID)loadGlobal()}
$('panel').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;au();const a=b.dataset.a,k=b.dataset.k,p=$('panel').dataset.k;
 if(a=='close'){show('panel',0);rc=0;return}
 if(a=='up'){const u=UP[k],c=u.c[S.up[k]];if(S.coins>=c){S.coins-=c;S.up[k]++;sfx('buy')}}
 if(a=='buy'){const c=CH[k];if(S.coins>=c.p){S.coins-=c.p;S.owned.push(+k);S.sel=+k;setHero(+k);sfx('buy')}}
 if(a=='sel'){S.sel=+k;setHero(+k);sfx('buy')}
 if(a=='tg'){S[k]=S[k]?0:1;if(k=='q')rs()}
 if(a=='rst'){if(rc){localStorage.removeItem('sheru_runner_v1');location.reload();return}rc=1}
 save();ui();panel(p)};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{au();rc=0;panel(b.dataset.m)});
/* ---------- boot ---------- */
$('av').src=PHOTO;setHero(S.sel);rs();(async()=>{try{if(window.claude){DB=await claude.use('db');const u=await claude.use('user');UID=u?await u.id():null}}catch(e){}})();resetWorld();ui();requestAnimationFrame(loop);
</script></body></html>
